<svg viewBox="0 0 1400 820" xmlns="http://www.w3.org/2000/svg" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img">
<title>Clementine's self-healing loop: two lanes and a ledger</title>
<desc>A nightly painted-DOM check measures every component. Drift is flagged into two lanes: mechanical drift is fixed by a deterministic script as a pull request that must pass the contract gates; judgment drift is filed as an issue for a person. If a person closes a loop pull request without merging it, the rejection must be written as a rule in governance/loop-rules.md, which the next nightly run reads first.</desc>
<defs>
  <marker id="a-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
    <path d="M1.5 1.5L8 5L1.5 8.5" fill="none" stroke="#305EB7" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
  <marker id="a-org" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
    <path d="M1.5 1.5L8 5L1.5 8.5" fill="none" stroke="#E86800" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
  <marker id="a-grey" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
    <path d="M1.5 1.5L8 5L1.5 8.5" fill="none" stroke="#83807A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<!-- paper -->
<rect width="1400" height="820" fill="#FBFBFA"/>
<rect x="28" y="28" width="1344" height="764" rx="20" fill="none" stroke="#E7E6E3" stroke-width="2"/>

<!-- heading -->
<g font-family="'JetBrains Mono', ui-monospace, Menlo, monospace">
  <rect x="92" y="78" width="12" height="12" rx="6" fill="#E86800"/>
  <text x="114" y="90" font-size="15" font-weight="600" fill="#E86800" letter-spacing="2.5">CLEMENTINE · THE SELF-HEALING LOOP</text>
</g>
<text x="92" y="144" font-size="44" font-weight="700" fill="#2A2926">A rejected fix can't evaporate. It becomes a rule.</text>
<text x="92" y="182" font-size="20" fill="#65635E">Measure, flag, fix, gate, encode. Scripts fix only what can be derived from source. People decide the rest.</text>

<!-- lane labels -->
<text x="500" y="262" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace" font-size="13" font-weight="600" fill="#305EB7" letter-spacing="1.5">MECHANICAL DRIFT · DERIVABLE FILES</text>
<text x="500" y="452" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace" font-size="13" font-weight="600" fill="#E86800" letter-spacing="1.5">JUDGMENT DRIFT · NEEDS A PERSON</text>

<!-- connectors -->
<path d="M262 385H296" stroke="#83807A" stroke-width="2.5" marker-end="url(#a-grey)"/>
<path d="M452 370C476 370 470 324 494 324" fill="none" stroke="#305EB7" stroke-width="2.5" marker-end="url(#a-ink)"/>
<path d="M452 400C476 400 470 514 494 514" fill="none" stroke="#E86800" stroke-width="2.5" marker-end="url(#a-org)"/>
<path d="M690 324H714" stroke="#305EB7" stroke-width="2.5" marker-end="url(#a-ink)"/>
<!-- the rejection -->
<path d="M830 368V464" stroke="#E86800" stroke-width="2.5" stroke-dasharray="6 6" marker-end="url(#a-org)"/>
<text x="842" y="410" font-size="14" font-weight="600" fill="#E86800">a person closes</text>
<text x="842" y="428" font-size="14" font-weight="600" fill="#E86800">it without merging</text>
<path d="M940 514H994" stroke="#E86800" stroke-width="2.5" marker-end="url(#a-org)"/>
<!-- return path: the ledger feeds the next run -->
<path d="M1154 580V628H177V446" fill="none" stroke="#83807A" stroke-width="2" stroke-dasharray="2 7" stroke-linecap="round" marker-end="url(#a-grey)"/>
<rect x="470" y="614" width="404" height="28" rx="14" fill="#FBFBFA"/>
<text x="672" y="633" text-anchor="middle" font-size="15" fill="#65635E">the next nightly run reads the ledger first</text>

<!-- stage boxes -->
<g font-family="'JetBrains Mono', ui-monospace, Menlo, monospace" font-size="12" font-weight="600" letter-spacing="1.5">
  <rect x="92" y="330" width="170" height="110" rx="10" fill="#FFFFFF" stroke="#C6C4C0" stroke-width="1.5"/>
  <text x="110" y="356" fill="#83807A">MEASURE</text>

  <rect x="302" y="330" width="150" height="110" rx="10" fill="#FFFFFF" stroke="#C6C4C0" stroke-width="1.5"/>
  <text x="320" y="356" fill="#83807A">FLAG</text>

  <rect x="500" y="280" width="190" height="88" rx="10" fill="#F1F6FF" stroke="#83ACF6" stroke-width="1.5"/>
  <text x="518" y="304" fill="#305EB7">FIX</text>

  <rect x="720" y="280" width="220" height="88" rx="10" fill="#F1F6FF" stroke="#83ACF6" stroke-width="1.5"/>
  <text x="738" y="304" fill="#305EB7">GATE</text>

  <rect x="500" y="470" width="190" height="88" rx="10" fill="#FEF3EE" stroke="#FEAF85" stroke-width="1.5"/>
  <text x="518" y="494" fill="#E86800">FILE</text>

  <rect x="720" y="470" width="220" height="88" rx="10" fill="#FFFFFF" stroke="#E86800" stroke-width="2"/>
  <text x="738" y="494" fill="#E86800">ENCODE</text>
</g>
<g font-size="16" fill="#2A2926">
  <text x="110" y="384" font-weight="600">Painted-DOM</text>
  <text x="110" y="404" font-weight="600">check</text>
  <text x="110" y="426" font-size="13" fill="#65635E">nightly, real browser</text>

  <text x="320" y="384" font-weight="600">Sort the drift</text>
  <text x="320" y="406" font-size="13" fill="#65635E">derivable, or a</text>
  <text x="320" y="424" font-size="13" fill="#65635E">judgment call?</text>

  <text x="518" y="328" font-weight="600">Script opens a PR</text>
  <text x="518" y="350" font-size="13" fill="#65635E">4 named fixers, no AI</text>

  <text x="738" y="328" font-weight="600">Contract gates pass</text>
  <text x="738" y="350" font-size="13" fill="#65635E">on that commit, then merge</text>

  <text x="518" y="518" font-weight="600">Opened as an issue</text>
  <text x="518" y="540" font-size="13" fill="#65635E">a person decides the fix</text>

  <text x="738" y="518" font-weight="600">Write the rule down</text>
  <text x="738" y="540" font-size="13" fill="#65635E">the loop opens the task itself</text>
</g>

<!-- the ledger -->
<g>
  <rect x="1000" y="250" width="308" height="330" rx="12" fill="#FFFFFF" stroke="#C6C4C0" stroke-width="1.5"/>
  <rect x="1000" y="250" width="308" height="56" rx="12" fill="#F6F6F4"/>
  <rect x="1000" y="290" width="308" height="16" fill="#F6F6F4"/>
  <line x1="1000" y1="306" x2="1308" y2="306" stroke="#DFDEDB" stroke-width="1.5"/>
  <text x="1020" y="276" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace" font-size="14" font-weight="600" fill="#2A2926">governance/loop-rules.md</text>
  <text x="1020" y="296" font-size="12.5" fill="#65635E">The loop only ever adds to this file.</text>

  <g font-size="13.5" fill="#2A2926">
    <text x="1020" y="333" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace" font-size="12" fill="#E86800">2026-06-29</text>
    <text x="1020" y="353" font-weight="600">ARIA grep flagged Mantine wrappers</text>
    <text x="1020" y="371" fill="#65635E">Rule: check the rendered DOM instead.</text>

    <text x="1020" y="401" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace" font-size="12" fill="#E86800">2026-06-30</text>
    <text x="1020" y="421" font-weight="600">A check graded its own homework</text>
    <text x="1020" y="439" fill="#65635E">Rule: fix false positives in the</text>
    <text x="1020" y="457" fill="#65635E">verifier, never waive them.</text>

    <text x="1020" y="491" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace" font-size="12.5" fill="#305EB7">skip: &lt;fixer&gt;</text>
    <text x="1020" y="509" fill="#65635E">One line switches one fixer off.</text>

    <text x="1020" y="543" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace" font-size="12.5" fill="#305EB7">LOOP_PAUSED=true</text>
    <text x="1020" y="561" fill="#65635E">Stops the whole loop.</text>
  </g>
</g>

<!-- what the record says -->
<line x1="92" y1="684" x2="1308" y2="684" stroke="#E7E6E3" stroke-width="1.5"/>
<g font-size="15" fill="#65635E">
  <text x="92" y="726"><tspan font-family="'JetBrains Mono', ui-monospace, Menlo, monospace" font-weight="600" fill="#2A2926">11</tspan>  loop PRs opened, all merged</text>
  <text x="440" y="726"><tspan font-family="'JetBrains Mono', ui-monospace, Menlo, monospace" font-weight="600" fill="#2A2926">0</tspan>  rejected so far</text>
  <text x="680" y="726"><tspan font-family="'JetBrains Mono', ui-monospace, Menlo, monospace" font-weight="600" fill="#2A2926">2</tspan>  rules, both from a verifier's own false positives</text>
  <text x="1308" y="726" text-anchor="end" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace" font-size="12" fill="#83807A">as of Nov 2026</text>
</g>
</svg>
