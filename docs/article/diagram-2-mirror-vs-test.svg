<svg viewBox="0 0 1200 680" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t2 d2" font-family="-apple-system, 'SF Pro Display', Inter, 'Segoe UI', Roboto, sans-serif">
  <title id="t2">A check that reads the spec versus a check that reads the screen</title>
  <desc id="d2">On the left, the spec is validated against itself in a loop and stays green. On the right, the rendered component's painted pixel is compared against the contract and returns a real percentage.</desc>
  <defs>
    <marker id="g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1.5 1.5L8 5L1.5 8.5" fill="none" stroke="#93908B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1.5 1.5L8 5L1.5 8.5" fill="none" stroke="#305EB7" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <rect width="1200" height="680" fill="#FFFFFF"/>
  <text x="80" y="96" font-size="15" font-weight="600" fill="#6E6B65">The honesty check</text>
  <text x="80" y="140" font-size="38" font-weight="700" fill="#1D1C1A" letter-spacing="-0.8">A check that grades itself is a mirror.</text>
  <line x1="600" y1="186" x2="600" y2="620" stroke="#E7E6E3" stroke-width="1.5"/>

  <!-- left: reads the paperwork -->
  <text x="80" y="210" font-size="17" font-weight="600" fill="#93908B">Reads the paperwork</text>
  <rect x="80" y="236" width="200" height="92" rx="20" fill="#F6F6F4"/>
  <text x="104" y="276" font-size="20" font-weight="600" fill="#1D1C1A">Spec</text>
  <text x="104" y="304" font-size="15" fill="#6E6B65">what I wrote</text>
  <rect x="340" y="236" width="200" height="92" rx="20" fill="#F6F6F4"/>
  <text x="364" y="276" font-size="20" font-weight="600" fill="#1D1C1A">Validator</text>
  <text x="364" y="304" font-size="15" fill="#6E6B65">is it consistent?</text>
  <path d="M280 282 H 334" stroke="#93908B" stroke-width="2.5" marker-end="url(#g)"/>
  <path d="M440 328 V 360 Q 440 380 420 380 H 200 Q 180 380 180 360 V 334" fill="none" stroke="#93908B" stroke-width="2.5" marker-end="url(#g)"/>
  <text x="310" y="410" text-anchor="middle" font-size="15" fill="#6E6B65">checks the spec against the spec</text>
  <rect x="210" y="446" width="200" height="48" rx="24" fill="#EAF6EE"/>
  <circle cx="240" cy="470" r="12" fill="#198044"/><path d="M234.5 470 l3.8 3.8 l7 -7.6" stroke="#fff" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="262" y="476" font-size="17" font-weight="600" fill="#198044">Always green</text>
  <text x="80" y="562" font-size="16" fill="#6E6B65">It never opened the component file.</text>
  <text x="80" y="588" font-size="16" fill="#6E6B65">Green meant well-formed, not wired.</text>

  <!-- right: reads the screen -->
  <text x="660" y="210" font-size="17" font-weight="600" fill="#305EB7">Reads the screen</text>
  <rect x="660" y="236" width="220" height="92" rx="20" fill="#F6F6F4"/>
  <text x="684" y="276" font-size="20" font-weight="600" fill="#1D1C1A">Rendered button</text>
  <text x="684" y="304" font-size="15" fill="#6E6B65">in a real browser</text>
  <rect x="660" y="368" width="220" height="92" rx="20" fill="#F6F6F4"/>
  <text x="684" y="408" font-size="20" font-weight="600" fill="#1D1C1A">Painted pixel</text>
  <text x="684" y="436" font-size="15" fill="#6E6B65" font-family="'SF Mono', ui-monospace, Menlo, monospace">getComputedStyle</text>
  <rect x="940" y="368" width="180" height="92" rx="20" fill="#F1F6FF"/>
  <text x="964" y="408" font-size="20" font-weight="600" fill="#1D1C1A">The contract</text>
  <text x="964" y="436" font-size="15" fill="#6E6B65">resolved value</text>
  <path d="M770 328 V 362" stroke="#305EB7" stroke-width="2.5" marker-end="url(#b)"/>
  <path d="M880 414 H 934" stroke="#305EB7" stroke-width="2.5" marker-end="url(#b)"/>
  <text x="907" y="396" text-anchor="middle" font-size="13" fill="#305EB7">vs</text>
  <rect x="660" y="490" width="220" height="48" rx="24" fill="#F1F6FF"/>
  <text x="770" y="521" text-anchor="middle" font-size="17" font-weight="600" fill="#305EB7">89%, with a list</text>
  <text x="660" y="588" font-size="16" fill="#6E6B65">The first number it gave me was how much I had not finished.</text>
</svg>
