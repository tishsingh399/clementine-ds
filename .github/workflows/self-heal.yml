name: Self-heal

# The loop: Measure → Flag → Fix → Gate → Encode.
#
# This workflow is the automated inner cycle for the MECHANICAL drift class —
# files that are derivable from the source of truth (the generated component
# index, typed token exports, the agentic knowledge indexes, the doc count markers). The fixers are
# deterministic scripts, not an AI: same input, same output, reviewable diff.
#
# Judgment-class findings (a component off its contract, a stale spec) are NOT
# auto-fixed — they're filed as a GitHub issue for a human/agent to close.
#
# Guardrails:
#  - kill switch: repo variable LOOP_PAUSED=true stops the loop entirely
#  - scalpel:     `skip: <fixer>` lines in governance/loop-rules.md disable one fixer
#  - gate:        the fix ships as a PR; branch protection requires the
#                 independent "Contract gates" check to pass on that exact
#                 commit before auto-merge can complete
#  - bounded:     the loop may only run the four named fixers; it never edits
#                 components, specs, tokens source, or loop-rules.md
on:
  # Runs when the nightly painted-DOM job finishes, so re-verification can use
  # that run's report. GitHub starts scheduled jobs hours late and at varying
  # times, so ordering two cron schedules by clock time was not reliable.
  workflow_run:
    workflows: ['DOM parity (nightly)']
    types: [completed]
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write

concurrency:
  group: self-heal
  cancel-in-progress: false

jobs:
  heal:
    name: Detect and heal mechanical drift
    runs-on: ubuntu-latest
    if: ${{ vars.LOOP_PAUSED != 'true' }}
    steps:
      - uses: actions/checkout@v7
        with:
          # With a LOOP_TOKEN secret (fine-grained PAT, this repo, contents+PR
          # write), loop PRs are authored as the owner: the gate runs natively
          # on the PR and auto-merge completes unattended (full-auto). Without
          # it, the workflow token opens the PR and GitHub holds the PR-bound
          # gate run for a one-click "approve and run" (semi-auto). Either way
          # the same independent gate decides; the token only changes who is
          # named as the PR author.
          token: ${{ secrets.LOOP_TOKEN || github.token }}

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @clementine-ds/tokens build

      - name: Fetch the painted-DOM report and the commit it measured
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Triggered by the DOM job: use that exact run. Started by hand: use the
          # latest completed DOM run. verify-specs ignores a report made on another
          # commit, so a stale one can never re-verify anything.
          RUN="${{ github.event.workflow_run.id }}"
          SHA="${{ github.event.workflow_run.head_sha }}"
          if [ -z "$RUN" ]; then
            read -r RUN SHA < <(gh run list --workflow "DOM parity (nightly)" --status completed --limit 1 \
              --json databaseId,headSha --jq '.[0] | "\(.databaseId) \(.headSha)"')
          fi
          if [ -n "$RUN" ] && gh run download "$RUN" -n parity-dom-report -D /tmp/dom; then
            echo "DOM_REPORT=/tmp/dom/parity-dom-report.json" >> "$GITHUB_ENV"
            echo "DOM_COMMIT=$SHA" >> "$GITHUB_ENV"
          else
            echo "No painted-DOM report found; specs it measures will not be re-verified this run."
          fi

      - name: Run fixers (obeying governance/loop-rules.md)
        run: |
          skip() { grep -qE "^skip: $1\$" governance/loop-rules.md; }
          skip tokens-index    || pnpm tokens:index
          skip token-types     || pnpm tokens:types
          skip agentic-indexes || pnpm agentic:indexes
          skip counts          || pnpm counts
          # Moves a spec's last_verified only when its evidence passes on this
          # commit; a spec that fails keeps its old date and is reported below.
          skip verify-specs    || node scripts/verify-specs.mjs ${DOM_REPORT:+--dom "$DOM_REPORT" --dom-commit "$DOM_COMMIT"}
          git checkout -- apps/observatory/parity-report.json 2>/dev/null || true

      - name: Anything to heal?
        id: diff
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Boring pass — nothing drifted. That's the loop working."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --cached --stat
          fi

      - name: Verify the healed tree in-job (belt; the PR gate is braces)
        if: steps.diff.outputs.changed == 'true'
        run: pnpm contract

      - name: Open the loop PR with auto-merge
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.LOOP_TOKEN || github.token }}
          LOOP_TOKEN_PRESENT: ${{ secrets.LOOP_TOKEN != '' }}
        run: |
          BRANCH="loop/heal-$(date -u +%Y%m%d-%H%M)"
          git config user.name  "clementine-loop"
          git config user.email "loop@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git commit -m "loop: heal mechanical drift (regenerated derivable files)"
          git push origin "$BRANCH"
          gh label create self-heal --force --color F97316 \
            --description "Opened by the self-healing loop" >/dev/null 2>&1 || true
          PR_URL=$(gh pr create --base main --head "$BRANCH" --label self-heal \
            --title "loop: heal mechanical drift" \
            --body "Opened automatically by the Self-heal workflow. The diff below is the output of deterministic fixers (tokens:index, tokens:types, agentic:indexes, counts, verify-specs) — no hand-written changes. The independent Contract gates check must pass on this exact commit before auto-merge completes. Reject this PR (close without merging) and the Loop encode workflow will file an 'encode the rule' task.")
          # If LOOP_TOKEN authored the PR, normal pull_request checks run
          # natively. If the workflow token authored it, ask the independent
          # gate to inspect the branch because workflow-token PRs do not
          # trigger pull_request workflows on their own.
          if [ "$LOOP_TOKEN_PRESENT" = "true" ]; then
            echo "LOOP_TOKEN present; pull_request checks will run natively."
          else
            gh workflow run "Contract checks" --ref "$BRANCH"
          fi
          gh pr merge --auto --squash "$PR_URL"
          echo "Loop PR: $PR_URL (auto-merge armed, waiting on the gate)"

      - name: File judgment-class findings as an issue
        # always(): the report matters most on the nights an earlier step fails.
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/parity-report.mjs > /tmp/parity.txt 2>&1 || true
          node scripts/check-spec-honesty.mjs > /tmp/honesty.txt 2>&1 || true
          node scripts/verify-specs.mjs --dry-run ${DOM_REPORT:+--dom "$DOM_REPORT" --dom-commit "$DOM_COMMIT"} > /tmp/verify.txt 2>&1 || true
          FAILING=$(grep -c 'not re-verified —' /tmp/verify.txt || true)
          # The nightly health report, on every run, good nights included.
          {
            echo "## Nightly health"
            echo '```'
            cat /tmp/parity.txt
            grep -E '^Checked' /tmp/honesty.txt || true
            cat /tmp/verify.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          BELOW=$(grep -oE '[0-9]+ below' /tmp/parity.txt | grep -oE '^[0-9]+' || echo 0)
          WARNS=$(grep -oE '[0-9]+ warning' /tmp/honesty.txt | grep -oE '^[0-9]+' || echo 0)
          if [ "${BELOW:-0}" -gt 0 ] || [ "${WARNS:-0}" -gt 0 ] || [ "${FAILING:-0}" -gt 0 ]; then
            TITLE="loop: judgment-class findings need a human or an agent"
            {
              echo "Found by the nightly loop — these are NOT auto-fixed by design."
              echo ""
              echo '```'
              cat /tmp/parity.txt
              grep '⚠︎' /tmp/honesty.txt || true
              grep -E 'verify-specs|not re-verified' /tmp/verify.txt || true
              echo '```'
            } > /tmp/body.md
            EXISTING=$(gh issue list --state open --search "$TITLE in:title" --json number --jq '.[0].number')
            if [ -n "$EXISTING" ]; then
              gh issue comment "$EXISTING" --body-file /tmp/body.md
            else
              gh issue create --title "$TITLE" --body-file /tmp/body.md --label self-heal
            fi
          else
            echo "No judgment-class findings. Nothing to file."
          fi
